name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core >/dev/null
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 && sudo chmod +x /usr/local/bin/yq
          pip install -q weasyprint markdown
      - name: Render PDFs
        run: scripts/render-pdf.sh
      - name: Build site
        run: scripts/build-site.sh
      - name: Check
        run: scripts/check.sh
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
